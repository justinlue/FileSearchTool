[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff"
version = "0.1.0"
description = "Find files by name across all fixed drives, backed by a SQLite index."
requires-python = ">=3.12"

[project.scripts]
ff = "ff.cli:main"

[tool.setuptools]
packages = ["ff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
